<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>קורס מניקור ג'ל מתחילות, פרטי אחד על אחד</title>
    <meta
      name="description"
      content="קורס פרטי אחד על אחד במניקור ג'ל למתחילות: אנטומיה של הציפורן, היגיינה ועיקור, מניקור משולב, שיוף ומבנה אנטומי, מריחת צבע ולק ג'ל. ליווי אישי וחוברת עבודה."
    />

    <meta property="og:title" content="קורס מניקור ג'ל מתחילות, פרטי אחד על אחד" />
    <meta
      property="og:description"
      content="קורס מניקור ג'ל מתחילות, פרטי אחד על אחד, בקצב שלך. ליווי אישי, תרגול מעשי וחוברת עבודה."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://rbknails.co.il/" />
    <meta name="theme-color" content="#f7f1e8" />
    <link rel="canonical" href="https://rbknails.co.il/" />

    <!-- Structured data. Kept in the static HTML because Google reads the markup
         before running the app, so anything React renders would be missed. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "BeautySalon",
            "@id": "https://rbknails.co.il/#business",
            "name": "rbknails",
            "url": "https://rbknails.co.il/",
            "telephone": "+972545817707",
            "image": "https://rbknails.co.il/favicon.svg",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "כפר יונה",
              "addressCountry": "IL"
            },
            "sameAs": ["https://www.instagram.com/rbknails/"]
          },
          {
            "@type": "Course",
            "name": "קורס מניקור ג'ל מתחילות",
            "url": "https://rbknails.co.il/course/1",
            "description": "קורס פרטי אחד על אחד במניקור ולק ג'ל למתחילות: אנטומיה של הציפורן, היגיינה ועיקור, טכניקות עבודה ותרגול מעשי על מודליסטית.",
            "inLanguage": "he",
            "provider": { "@id": "https://rbknails.co.il/#business" },
            "hasCourseInstance": {
              "@type": "CourseInstance",
              "courseMode": "onsite",
              "courseWorkload": "PT4H"
            }
          }
        ]
      }
    </script>

    <!-- Wordmark only, so a single weight of a single family. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
